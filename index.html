<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Run n Beer — No Run No Beer</title>
  <meta name="description" content="Run n Beer community training hub." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/site.css" />
  <style>
    .home-hero{min-height:100vh;display:grid;align-items:center;position:relative;overflow:hidden;background:linear-gradient(135deg,#dfff4a 0%,#eaff86 100%);color:#111}
    .home-hero:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(255,255,255,.45),transparent 28%)}
    .home-grid{position:relative;display:grid;grid-template-columns:.8fr 1.2fr;gap:48px;align-items:center;padding-top:54px;padding-bottom:54px}
    .home-logo{width:min(310px,70vw);filter:drop-shadow(0 14px 30px rgba(0,0,0,.2))}
    .home-kicker{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.14em}
    .home-title{font:900 clamp(70px,12vw,150px)/.76 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:16px 0 22px;letter-spacing:-.02em}
    .home-title span{display:block}
    .home-copy{max-width:620px;font-size:17px;line-height:1.7;color:rgba(17,17,17,.72)}
    .home-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
    .home-primary{display:inline-flex;padding:13px 18px;border-radius:8px;background:#08111f;color:#fff!important;font-size:12px;font-weight:900;text-transform:uppercase}
    .home-secondary{display:inline-flex;padding:13px 18px;border-radius:8px;border:1px solid rgba(17,17,17,.35);color:#111!important;font-size:12px;font-weight:900;text-transform:uppercase}
    .home-note{margin-top:28px;font-size:11px;font-weight:800;text-transform:uppercase;color:rgba(17,17,17,.55)}
    @media(max-width:760px){.home-grid{grid-template-columns:1fr;text-align:center}.home-logo{margin:auto}.home-copy{margin:auto}.home-actions{justify-content:center}.home-title{font-size:84px}}
  </style>
</head>
<body class="rn-site">
  <main class="home-hero">
    <div class="rn-wrap home-grid">
      <div><img class="home-logo" src="/logo.svg" alt="Run n Beer logo"></div>
      <div>
        <div class="home-kicker">Run n Beer · Est. 2017</div>
        <h1 class="home-title"><span>No Run.</span><span>No Beer.</span></h1>
        <p class="home-copy">Ở đây vẫn chưa có bia đâu. Nhưng giờ đã có Training Plans — nơi gom các dự án tập luyện của Run n Beer thành một hệ thống dễ xem, dễ theo và dễ quay lại mỗi tuần.</p>
        <div class="home-actions">
          <a class="home-primary" href="/plan/">Explore Training Plans →</a>
          <a class="home-secondary" href="/plan/full-marathon/12-week/">Open 12-Week FM Plan</a>
        </div>
        <div class="home-note">Community training · Trust the miles.</div>
      </div>
    </div>
  </main>
</body>
</html>
